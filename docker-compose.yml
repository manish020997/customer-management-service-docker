version: "3.8"

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: CustomerDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - customer-network

  app:
    build: .
    container_name: docker-basic-assignment-container
    depends_on:
      - postgres-db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/CustomerDB
      SPRING_DATASOURCE_USER: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - customer-network

networks:
  customer-network:
    driver: bridge